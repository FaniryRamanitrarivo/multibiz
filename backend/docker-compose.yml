services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        ports:
            - '${APP_PORT:-8000}:8000'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            CODESPACE_NAME: '${CODESPACE_NAME:-}'
            GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: '${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}'
            DB_HOST: host.docker.internal
            DB_PORT: '${FORWARD_DB_PORT:-5432}'
            REDIS_HOST: host.docker.internal
            REDIS_PORT: '${FORWARD_REDIS_PORT:-6379}'
            MAIL_HOST: host.docker.internal
            MAIL_PORT: '${FORWARD_MAILPIT_PORT:-1025}'
        volumes:
            - '.:/var/www/html'
            - 'multibiz-vendor:/var/www/html/vendor'
        # --no-reload: artisan serve otherwise strips any env var not on its
        # passthrough allowlist from the forked request-handling process, so
        # our DB_HOST/REDIS_HOST overrides below would be silently dropped
        # and it would fall back to backend/.env's host-oriented values.
        command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000', '--no-reload']
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - multibiz
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            CODESPACE_NAME: '${CODESPACE_NAME:-}'
            GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: '${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}'
            DB_HOST: host.docker.internal
            DB_PORT: '${FORWARD_DB_PORT:-5432}'
            REDIS_HOST: host.docker.internal
            REDIS_PORT: '${FORWARD_REDIS_PORT:-6379}'
            MAIL_HOST: host.docker.internal
            MAIL_PORT: '${FORWARD_MAILPIT_PORT:-1025}'
        volumes:
            - '.:/var/www/html'
            - 'multibiz-vendor:/var/www/html/vendor'
        command: ['php', 'artisan', 'queue:listen', '--tries=1', '--timeout=0']
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - multibiz
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - multibiz
    vite:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        ports:
            - '5173:5173'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            CODESPACE_NAME: '${CODESPACE_NAME:-}'
            GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: '${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}'
            DB_HOST: host.docker.internal
            DB_PORT: '${FORWARD_DB_PORT:-5432}'
            REDIS_HOST: host.docker.internal
            REDIS_PORT: '${FORWARD_REDIS_PORT:-6379}'
        volumes:
            - '.:/var/www/html'
            - 'multibiz-vendor:/var/www/html/vendor'
            - 'multibiz-node-modules:/var/www/html/node_modules'
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - multibiz
    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'multibiz-pgsql:/var/lib/postgresql'
            - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - multibiz
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-h'
                - 127.0.0.1
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'multibiz-redis:/data'
        networks:
            - multibiz
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    multibiz:
        driver: bridge
volumes:
    multibiz-pgsql:
        driver: local
    multibiz-redis:
        driver: local
    multibiz-vendor:
        driver: local
    multibiz-node-modules:
        driver: local
